name = "newupdater-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 3x daily digests (UTC). Adjust to your timezone.
# 07:00 morning, 12:00 afternoon, 19:00 night.
[triggers]
crons = ["0 7,12,19 * * *"]

[[kv_namespaces]]
binding = "SEEN_KV"
id = "d2c48af15ebb43f39d14e4ff2c4e1393"
preview_id = "d2c48af15ebb43f39d14e4ff2c4e1393"

[vars]
TOPICS = "AI agents,developer tools,open source"
TELEGRAM_CHAT_ID = "6392974527"

# Secrets (never commit). Set with:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put TWITTERAPIS_KEY
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
