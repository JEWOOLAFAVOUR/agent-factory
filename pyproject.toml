[project]
name = "ai-projects-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JEWOOLAFAVOUR", email = "jewoolafavour2020@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.14",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-projects-lab = "ai_projects_lab:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "projects/newupdater",
]
